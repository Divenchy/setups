"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#a3aed2)\
[  ](bg:#a3aed2 fg:#090c0c)\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[cmd_duration]
min_time = 500
format = "took [$duration](yellow) "
### LANGUAGES ###

[nodejs]
format = "[$symbol($version)]($style) "
symbol = ""
style = "green"

[python]
format = "[$symbol$version]($style) "
symbol = ""
style = "yellow"

[rust]
format = "[$symbol($version)]($style) "
symbol = ""
style = "red"

[zig]
format = "[$symbol($version)]($style) "
symbol = ""
style = "yellow"

[elixir]
format = "[$symbol($version)]($style) "
symbol = ""
style = "purple"

[erlang]
format = "[$symbol($version)]($style) "
symbol = ""
style = "red"

[gleam]
format = "[$symbol($version)]($style) "
symbol = "⭐ "
style = "pink"

# Odin (custom - not built into starship)
[custom.odin]
command = "odin version 2>/dev/null | awk '{print $3}'"
when = "test -f *.odin || test -d src && ls src/*.odin 2>/dev/null"
format = "[$symbol($output)]($style) "
symbol = "◎ "
style = "blue"
detect_files = ["*.odin"]
detect_folders = []
